/* Layout: a dusty-blue embossed envelope sealed with cream wax; tapping it folds the flap back and reveals a cream letter laid over a painted floral backdrop with hanging lanterns. Single deliberate look. */
:root{}
@font-face{font-family:"Cormorant Fallback";src:local("Cormorant Garamond"),local("EB Garamond"),local("Garamond"),local("Georgia"),local("Times New Roman"),local("Noto Serif"),local("DejaVu Serif");size-adjust:86%;ascent-override:95%;descent-override:30%;line-gap-override:0%}
@font-face{font-family:"Script Fallback";src:local("Snell Roundhand"),local("Apple Chancery"),local("Segoe Script"),local("Brush Script MT"),local("Dancing Script");size-adjust:92%}
:root{
  --blue:#4A0F1C;        /* page sides around the envelope */
  --env:#5C1626;         /* envelope paper */
  --blue-deep:#6E1A2B;   /* headings, names */
  --ink:#3E0F1A;         /* body text */
  --ink-soft:#5B2331;    /* italic text */
  --gold:#795722;        /* accent text */
  --gold-2:#6a4a14;      /* small caps */
  --line:#b08d4f;        /* gold rules */
  --paper:#F4EBDD;       /* letter */
  --pale:#EAD6CF;        /* ghost ampersand */
  --f-serif:"Cormorant Garamond","Cormorant Fallback",Georgia,serif;
  --f-script:"Great Vibes","Script Fallback","Cormorant Garamond",cursive;
  --f-ar:"Scheherazade New","Noto Naskh Arabic","Geeza Pro","Al Nile","Arabic Typesetting","Traditional Arabic",serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-variant-numeric:lining-nums}
html,body{background:var(--blue)}
body{color:var(--ink);font-family:var(--f-serif);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--line);outline-offset:4px}

/* ---------------- Envelope ---------------- */
.envelope{position:fixed;inset:0;z-index:10;overflow:hidden;background:var(--blue);transition:opacity .6s ease 1.5s}
.stage{--sw:min(100vw,calc(100vh * 736 / 1307));position:absolute;top:0;bottom:0;left:50%;width:var(--sw);transform:translateX(-50%);perspective:1600px;perspective-origin:50% 46%}
@media (max-aspect-ratio:3/5){.stage{--sw:100vw}}
.env-back{position:absolute;inset:0;background-color:var(--env);background-image:var(--emboss),var(--grain);background-size:300px 300px,180px 180px;background-blend-mode:overlay,soft-light}
.flap{--d:0s;position:absolute;inset:0;background-color:var(--env);background-image:var(--emboss),var(--grain);background-size:300px 300px,180px 180px;background-blend-mode:overlay,soft-light;backface-visibility:hidden;will-change:transform;
  transition:transform 1.2s cubic-bezier(.6,.03,.28,1) var(--d),opacity .3s ease calc(var(--d) + .85s)}
.flap-w{position:absolute;inset:0;filter:drop-shadow(0 1px 1px rgba(40,4,14,.45)) drop-shadow(0 3px 6px rgba(40,4,14,.22));pointer-events:none}
.flap--left{clip-path:polygon(0 0,50.5% 50%,0 100%);background-color:#561322;background-position:120px 40px,0 0}
.flap--right{clip-path:polygon(100% 0,49.5% 50%,100% 100%);background-color:#561322;background-position:40px 160px,0 0}
.flap--bottom{clip-path:polygon(0 100%,100% 100%,50.2% 57.5%);background-color:#5A1525;background-position:60px 90px,0 0}
.flap--top{--d:.45s;clip-path:polygon(10.46% 0,89.67% 0,50.27% 42.46%);transform-origin:50% 0;background-color:#5E1828}
.flap--top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(30,2,10,.12))}
.hint{position:absolute;bottom:calc(50% + var(--sw) * .17 + 16px);left:0;right:0;margin:0;text-align:center;font-weight:600;font-size:clamp(1rem,calc(var(--sw) * .074 - 4px),calc(2.05rem - 4px));color:#EAD3A4;text-shadow:0 1px 3px rgba(30,2,10,.6);transition:opacity .25s;padding-inline:16px}
.envelope-date{position:absolute;top:max(67.5%,calc(50% + var(--sw) * .17 + 28px));left:0;right:0;margin:0;display:flex;align-items:center;justify-content:center;gap:.9em;color:#f4ead2;font-size:calc(1.25rem - 4px);font-weight:600;letter-spacing:.14em;text-shadow:0 1px 4px rgba(30,2,10,.8);transition:opacity .4s}
.envelope-date::before,.envelope-date::after{content:"";width:2.2em;height:1px;background:currentColor;opacity:.8}
.seal{position:absolute;left:33%;top:50%;margin-top:-17%;width:34%;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(0 .45rem .7rem rgba(30,2,10,.45)) drop-shadow(0 1px 1px rgba(30,2,10,.35));animation:breathe 3.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.seal svg{display:block;width:100%;height:100%;overflow:visible}
.seal:focus-visible{outline-offset:8px;border-radius:50%}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes seal-break{0%{transform:scale(1);opacity:1}25%{transform:scale(1.07);opacity:1}100%{transform:scale(.86) rotate(-4deg);opacity:0}}
.butterfly{position:absolute;left:50%;top:50%;width:44px;height:36px;margin:-18px 0 0 -22px;opacity:0;pointer-events:none;z-index:3}
.butterfly .wl,.butterfly .wr{transform-box:fill-box;animation:flap .18s ease-in-out infinite alternate}
.butterfly .wl{transform-origin:100% 50%}.butterfly .wr{transform-origin:0 50%}
@keyframes flap{to{transform:scaleX(.25)}}
@keyframes butterfly-flight{0%{opacity:0;transform:translate(0,0) scale(.6) rotate(-10deg)}12%{opacity:1}35%{transform:translate(-22vw,-14vh) scale(1) rotate(-25deg)}62%{transform:translate(10vw,-30vh) scale(.95) rotate(12deg)}82%{opacity:1;transform:translate(26vw,-42vh) scale(.85) rotate(20deg)}100%{opacity:0;transform:translate(34vw,-56vh) scale(.7) rotate(26deg)}}
body.is-opening .envelope{pointer-events:none}
body.is-opening .seal{animation:seal-break .8s ease-in forwards}
body:not(.fonts-ready) .hint,body:not(.fonts-ready) .envelope-date{opacity:0}
body.is-opening .hint,body.is-opening .envelope-date{opacity:0}
body.is-opening .flap{opacity:0}
body.is-opening .flap--top{transform:rotateX(115deg)}
body.is-opening .env-back{opacity:0;transition:opacity .5s ease 1.25s}
body.is-opening .butterfly{animation:butterfly-flight 1.65s cubic-bezier(.35,.05,.55,.95) .08s both}
body.is-opening .envelope{opacity:0}

.music-toggle{position:fixed;z-index:30;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1.5px solid #c9a24f;background:rgba(62,11,22,.75);color:#f2dfae;font-size:20px;display:grid;place-items:center;cursor:pointer}

/* ---------------- Letter ---------------- */
.letter{min-height:100vh;background-color:#5E1526;background-image:var(--emboss),var(--grain),radial-gradient(120% 70% at 50% 30%,rgba(255,220,225,.07),rgba(20,0,6,.3));background-size:300px 300px,180px 180px,100% 100%;background-blend-mode:overlay,soft-light,normal;background-attachment:scroll;padding-block:clamp(34px,9vw,96px) clamp(30px,8vw,90px);padding-left:max(clamp(18px,6vw,92px),env(safe-area-inset-left,0px));padding-right:max(clamp(18px,6vw,92px),env(safe-area-inset-right,0px));opacity:0;transition:opacity 1s ease .9s}
body.is-open .letter{opacity:1}
.letter::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#5E1526;z-index:5}
.paper{position:relative;max-width:1100px;margin:0 auto;background:var(--paper);box-shadow:0 0 0 1px rgba(176,141,79,.45),0 12px 34px rgba(20,0,6,.45);padding:clamp(48px,9vw,90px) clamp(20px,5vw,60px) 60px;text-align:center}
.paper::before,.paper::after{content:"";position:absolute;pointer-events:none}
.paper::before{inset:8px;border:1.5px solid var(--line)}
.paper::after{inset:12px;border:1px solid rgba(176,141,79,.6)}
.col{position:relative;z-index:1;max-width:27rem;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.col p{margin:0}

.monos{display:flex;justify-content:center;align-items:center;margin-top:8px}
.mono{position:relative;width:min(62vw,250px);aspect-ratio:1.18}
.mono .amp{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-script);font-size:calc(min(46vw,190px) - 4px);line-height:1;color:var(--pale);transform:translate(8%,-6%)}
.mono .a,.mono .b{position:absolute;font-family:var(--f-script);line-height:1;color:var(--blue-deep);font-size:calc(min(31vw,128px) - 4px)}
.mono .a{left:6%;top:0}
.mono .b{left:40%;top:30%}
.mono svg.lily{position:absolute;left:-2%;bottom:-6%;width:52%;height:auto;color:#c39a3c}

.page-bismillah{width:min(84%,24rem);margin:clamp(1.5rem,4vh,2.5rem) auto clamp(1.25rem,3vh,2rem);font-family:var(--f-ar);font-weight:700;font-size:60px;line-height:1.3;white-space:nowrap;overflow:hidden;color:#5A1424;visibility:hidden}
.page-bismillah span{display:inline-block}
.opening-blessing{font-style:italic;font-weight:500;font-size:min(1.05em,3.75vw);line-height:1.5;color:var(--ink-soft);width:100%}
.opening-blessing span{display:block;white-space:nowrap}
.family-blessing{margin-top:1.8rem!important;font-style:italic;font-weight:700;font-size:1.35em;color:var(--gold)}
.family-names{margin-top:.7rem;border:2px solid var(--line);outline:1px solid var(--line);outline-offset:-7px;padding:16px 22px;font-weight:600;font-size:1.14em;line-height:1.55;color:var(--ink);background:rgba(255,255,255,.25)}
.family-names span{display:block;text-wrap:balance;overflow-wrap:break-word}
.family-names{width:100%;max-width:24rem}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,15rem);margin:2rem auto 1.4rem;color:var(--line)}
.divider::before,.divider::after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,transparent,var(--line))}
.divider::after{background:linear-gradient(90deg,var(--line),transparent)}
.divider i{width:9px;height:9px;background:#b8923f;transform:rotate(45deg)}
.family-hosts{font-weight:600;font-size:1.09em;letter-spacing:.17em;text-transform:uppercase;color:var(--blue-deep);line-height:1.5;text-wrap:balance}
.family-hosts span{display:block;text-wrap:balance;overflow-wrap:break-word}
@media (max-width:480px){.family-hosts{letter-spacing:.12em}}
.family-hosts{width:100%}
.announcement-names{width:100%}
.wrap,.wrap *{white-space:normal!important;text-wrap:balance}
.family-invitation{margin-top:.8rem!important;font-style:italic;font-weight:500;font-size:1.05em;color:var(--ink-soft);line-height:1.5;max-width:22em;text-wrap:balance}
.announcement-names{font-family:var(--f-script);font-size:clamp(calc(2.9rem - 4px),calc(13.5vw - 4px),calc(4rem - 4px));line-height:1.15;color:var(--blue-deep);margin-top:.4rem!important;white-space:nowrap}
.announcement-names span{font-size:.6em;color:var(--gold-2);margin:0 .12em}
.daughter-of{margin-top:.4rem!important;font-weight:700;font-size:.79em;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-2)}
.announcement-family{font-style:italic;font-weight:500;font-size:1.01em;color:var(--ink-soft)}
.scroll-cue{margin-top:2rem;display:inline-flex;align-items:center;gap:.6em;padding:.45em 1em;border:1.5px solid var(--line);outline:1px solid var(--line);outline-offset:2px;border-radius:6px;background:rgba(255,255,255,.3);color:var(--ink-soft);font-size:.96em;cursor:pointer;text-decoration:none}
.scroll-cue svg{width:14px;height:14px;color:var(--gold)}

.days{margin-top:5rem}
.days-kicker{font-style:italic;font-weight:700;font-size:1.06em;color:var(--gold)}
.month-title{display:flex;align-items:center;justify-content:center;gap:.25em;margin:.4rem 0 .5rem!important;font-style:italic;font-weight:700;font-size:clamp(calc(2.1rem - 4px),calc(9.5vw - 4px),calc(2.75rem - 4px));line-height:1.15;color:var(--ink)}
.month-title svg{width:.62em;height:.62em;flex:none}
.days-sub{font-weight:600;font-size:1em;color:var(--ink-soft)}
.cal-frame{position:relative;margin-top:1.6rem;width:min(100%,21.5rem);padding:26px 18px 30px;border:2px solid #c3a35c;outline:1px solid #c3a35c;outline-offset:-7px;border-radius:2px}
.cal-frame .c{position:absolute;width:22px;height:22px;background:var(--paper)}
.cal-frame .c::before{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#b8923f}
.cal-frame .c::after{content:"";position:absolute;width:20px;height:20px;border:1.5px solid #c3a35c;border-radius:50%}
.cal-frame .tl{top:-3px;left:-3px}.cal-frame .tl::before{top:4px;left:4px}.cal-frame .tl::after{top:-10px;left:-10px}
.cal-frame .tr{top:-3px;right:-3px}.cal-frame .tr::before{top:4px;right:4px}.cal-frame .tr::after{top:-10px;right:-10px}
.cal-frame .bl{bottom:-3px;left:-3px}.cal-frame .bl::before{bottom:4px;left:4px}.cal-frame .bl::after{bottom:-10px;left:-10px}
.cal-frame .br{bottom:-3px;right:-3px}.cal-frame .br::before{bottom:4px;right:4px}.cal-frame .br::after{bottom:-10px;right:-10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;font-variant-numeric:lining-nums tabular-nums}
.dow{font-weight:700;font-size:.82em;color:var(--gold);padding-bottom:6px}
.dow-rule{grid-column:1/-1;position:relative;height:14px;margin-bottom:6px}
.dow-rule::before{content:"";position:absolute;left:0;right:0;top:6px;height:1.5px;background:linear-gradient(90deg,transparent,#c3a35c 15%,#c3a35c 85%,transparent)}
.dow-rule::after{content:"";position:absolute;left:50%;top:2px;width:9px;height:9px;margin-left:-4.5px;background:#b8923f;transform:rotate(45deg);box-shadow:0 0 0 3px var(--paper)}
.cal-day{aspect-ratio:1;display:grid;place-items:center;font-weight:700;font-size:1.02em;color:var(--ink);border:0;background:none;padding:0}
.cal-day.marked{position:relative;color:#f4ead2;font-weight:600}
.cal-day.marked::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8C2A3E,var(--blue-deep) 70%);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px #c3a35c,0 3px 8px rgba(60,8,20,.35);z-index:-1}
.cal-day.marked{z-index:0}
.legend{list-style:none;margin:1.3rem 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.legend li{display:flex;align-items:center;gap:.5em;font-style:italic;font-weight:700;color:var(--ink-soft)}
.legend li::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--blue-deep);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px #c3a35c}

.closing-mono{margin-top:.5rem}
.closing-rule{width:min(60%,11rem);height:1.5px;margin:1.6rem auto 1rem;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.closing-blessing{font-style:italic;font-weight:700;font-size:1.02em;color:var(--gold)}
.closing-compliments{margin-top:.3rem!important;line-height:1.55;color:var(--ink)}
.closing-note{margin-top:1.1rem!important;font-style:italic;color:var(--ink-soft);max-width:19em;line-height:1.45}
.love{margin-top:.3rem!important;font-family:var(--f-script);font-weight:400;font-size:clamp(2.7rem,12vw,3.4rem);line-height:1.2;color:var(--blue-deep)}
.love-sub{font-style:italic;font-size:1.12em;color:var(--ink-soft)}
.invitees{margin-top:1.5rem!important;font-weight:700;font-size:.82em;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.pill{margin-top:.5rem;display:inline-block;padding:.12em .75em;border:1.5px solid #c3a35c;outline:1.5px solid #c3a35c;outline-offset:3px;border-radius:999px;font-weight:600;font-size:1.65em;color:var(--blue-deep);background:#f8f4ec}
.rsvp-title{margin-top:3.6rem!important;font-style:italic;font-weight:700;font-size:clamp(2.1rem,9.5vw,2.6rem);line-height:1.15;color:var(--blue-deep)}
.rsvp-text{color:var(--ink);max-width:20em}
.rsvp-btn{margin-top:1.4rem;display:inline-block;padding:.85em 2.2em;background:var(--blue-deep);color:#f0e1b8;font-weight:700;font-size:.92em;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;border-radius:4px;box-shadow:0 0 0 2px var(--paper),0 0 0 4px #c9a24f,0 6px 14px rgba(110,26,43,.25)}
.rsvp-btn.off{background:#C9A9AE;color:#f4ecdc;cursor:default}
.credit{margin-top:3.4rem!important;font-size:.62em;color:var(--ink-soft);letter-spacing:.04em}

/* event pop-up */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(40,52,62,.55);backdrop-filter:blur(2px);opacity:0;transition:opacity .35s}
.modal.show{opacity:1}
.ecard{position:relative;width:min(92vw,400px);aspect-ratio:3/4;max-height:88vh;background-color:#f6efe2;background-image:var(--vine),radial-gradient(120% 90% at 50% 40%,rgba(255,255,255,.7),transparent 70%);background-size:100% 100%,100% 100%;border:2px solid #c9a24f;box-shadow:0 0 0 4px #efe6d4,0 0 0 5px #c9a24f,0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12% 16%;transform:scale(.94);transition:transform .35s}
.modal.show .ecard{transform:none}
.e-title{font-family:var(--f-display);font-size:clamp(2.3rem,10vw,3rem);line-height:1.1;color:#3d3416;margin:0}
.e-lead{font-family:var(--f-script);font-size:1.25em;color:#4c4228;margin:.6em 0 .7em}
.e-when{font-weight:600;color:#4c4228;line-height:1.45;font-size:1.02em}
.e-where{margin-top:1em;font-weight:600;color:#4c4228;line-height:1.4;font-size:1.02em}
.e-where small{display:block;font-weight:500;font-size:.88em}
.e-loc{margin-top:1.2em;color:#4c4228;font-size:.95em;text-decoration:none;border-bottom:1px solid #c9a24f}
.e-orn{margin-top:1em;width:90px;height:12px;color:#8a7a4a}
.e-close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid #c9b48a;background:#fffaf0;color:#3d3416;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.2s!important;transition-delay:0s!important}}
@media (max-width:420px){body{font-size:13.5px}.paper{padding-inline:16px}}

<script>
/* =========================================================
   EDIT EVERYTHING HERE. Text in [brackets] is a placeholder.
   ========================================================= */
const CONFIG = {
  groom: "Qusai", bride: "Zahra", groomInitial: "Q", brideInitial: "Z",
  grace: [
    "By the Grace of Allah, Vasilat-e-Panjatan Pak (A.S.)",
    "Janab-e-Abbas (A.S.) and with the Dua Mubarak of",

  ],
  elders: ["Mr. Huzefa Yousuf Mamuwala", "Mrs. Umme Aiman Huzefa Mamuwala"],
  hosts: ["Mr. Huzefa Yousuf Mamuwala", "Mrs. Umme Aiman Huzefa Mamuwala"],
  inviteLine: "invite your gracious presence and blessings to celebrate the wedding of their son",
  brideParents: "Mr. Hasnain Jamali & Mrs. Masuma Hasnain",
  events: [
    { date: "2027-03-20", name: "[Event Name]", time: "[Time]", venue: "[Venue Name],", area: "[Area],", city: "[City]", mapUrl: "" }
  ],
  compliments: ["Mamuwala and family"],
  message: "Two families, two hearts, one beautiful beginning. It would mean the world to celebrate it with you.",
  invitees: "All",
  rsvpUrl: "",   // Google Form link
  musicUrl: ""   // e.g. "audio/music.mp3" when hosted
};
/* ========================================================= */

const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MONTH=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const ord=n=>n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const root=document.documentElement;
const main=parse(CONFIG.events[0].date);

document.querySelectorAll("[data-k]").forEach(el=>el.textContent=CONFIG[el.dataset.k]??"");
$("envDate").textContent=`${main.getDate()} . ${MON[main.getMonth()]} . ${main.getFullYear()}`;
$("grace").innerHTML=CONFIG.grace.map(l=>`<span>${esc(l)}</span>`).join("");
$("elders").innerHTML=CONFIG.elders.map(n=>`<span>${esc(n)}</span>`).join("");

$("compliments").innerHTML=CONFIG.compliments.map(esc).join("<br>");

/* ---------- seeded random ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- envelope: fine embossed floral line-art + grain ---------- */
(function(){
  const flower=(x,y,r,rot)=>{let p="";for(let i=0;i<5;i++){const a=rot+i*72;p+=`<path transform="translate(${x} ${y}) rotate(${a})" d="M0 0 C ${r*.55} ${-r*.35}, ${r*.6} ${-r*1.05}, 0 ${-r*1.15} C ${-r*.6} ${-r*1.05}, ${-r*.55} ${-r*.35}, 0 0Z"/>`;}
    let dots="";for(let i=0;i<10;i++){const a=i*36*Math.PI/180;dots+=`<circle cx="${(x+Math.cos(a)*r*.32).toFixed(1)}" cy="${(y+Math.sin(a)*r*.32).toFixed(1)}" r=".9"/>`;}
    return p+`<circle cx="${x}" cy="${y}" r="${r*.22}"/>`+dots};
  const leafy=(x1,y1,x2,y2,n)=>{let s=`<path d="M${x1} ${y1} Q ${(x1+x2)/2+18} ${(y1+y2)/2-10} ${x2} ${y2}"/>`;for(let i=1;i<=n;i++){const t=i/(n+1),x=x1+(x2-x1)*t,y=y1+(y2-y1)*t,sd=i%2?1:-1;s+=`<path transform="translate(${x} ${y}) rotate(${sd*55+Math.atan2(y2-y1,x2-x1)*57.3})" d="M0 0 C 4 -3, 10 -3, 14 0 C 10 3, 4 3, 0 0Z M0 0 L12 0"/>`;}return s};
  const art=`<g fill="none" stroke="#000" stroke-width="1.1" stroke-linecap="round">
    ${flower(70,80,34,10)}${flower(230,200,26,40)}${flower(150,255,14,0)}${flower(40,240,12,20)}
    ${leafy(100,110,190,40,6)}${leafy(-10,170,60,120,4)}${leafy(260,240,330,300,4)}${leafy(200,180,150,120,4)}${leafy(-30,300,40,250,4)}
    <path d="M250 60 C 262 70, 268 84, 266 98"/><circle cx="250" cy="58" r="2.4"/><circle cx="258" cy="66" r="2"/><circle cx="244" cy="66" r="2"/>
    <path d="M120 180 C 126 190, 128 200, 126 212"/><circle cx="118" cy="178" r="2.2"/><circle cx="126" cy="184" r="1.8"/>
  </g>`;
  const emboss=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
    <filter id="e" filterUnits="userSpaceOnUse" x="0" y="0" width="300" height="300" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="2.2" diffuseConstant=".72" lighting-color="#fff"><feDistantLight azimuth="235" elevation="52"/></feDiffuseLighting>
    </filter><g filter="url(#e)">${art}</g></svg>`;
  const grain=`<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0" intercept=".5"/></feComponentTransfer></filter><rect width="180" height="180" filter="url(#n)"/></svg>`;
  const u=s=>`url("data:image/svg+xml,${encodeURIComponent(s)}")`;
  root.style.setProperty("--emboss",u(emboss));root.style.setProperty("--grain",u(grain));
})();

/* ---------- wax seal: matte cream, pressed bouquet ---------- */
(function(){
  function blob(r,a1,a2,a3,seed){const N=72,pts=[];for(let i=0;i<N;i++){const a=i/N*Math.PI*2,rr=r+a1*Math.sin(3*a+seed)+a2*Math.sin(5*a+seed*2.3)+a3*Math.sin(11*a+seed*.7);pts.push([100+rr*Math.cos(a),100+rr*Math.sin(a)])}
    const mid=(p,q)=>[((p[0]+q[0])/2).toFixed(1),((p[1]+q[1])/2).toFixed(1)];let d=`M${mid(pts[0],pts[1]).join(" ")}`;for(let i=1;i<=N;i++){const p=pts[i%N],q=pts[(i+1)%N];d+=` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${mid(p,q).join(" ")}`}return d+"Z"}
  const SPILL=blob(92,4.2,2.4,.8,1.3),CORE=blob(84,3.4,1.6,.6,.4);
  // full, rounded bouquet: overlapping blossoms on top, leaves and gathered stems below
  const R2=rng(5);let g="";
  const stemsTo=[[100,86],[86,92],[114,92],[76,104],[124,104],[94,100],[106,100]];
  stemsTo.forEach(([x,y])=>{g+=`<path d="M100 150 Q${(100+x)/2} ${(150+y)/2+8} ${x} ${y}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`});
  [[78,122,-50],[122,122,50],[70,110,-65],[130,110,65],[88,132,-35],[112,132,35],[82,98,-80],[118,98,80]].forEach(([x,y,r])=>{
    g+=`<path transform="translate(${x} ${y}) rotate(${r})" d="M0 0 C 3 -5, 3 -11, 0 -15 C -3 -11, -3 -5, 0 0Z" fill="#fff"/>`});
  const blossoms=[[100,66,8.5],[86,72,7.5],[114,72,7.5],[74,84,6.8],[126,84,6.8],[93,85,7],[107,85,7],[100,98,6.2],[80,98,5.6],[120,98,5.6],[68,98,4.6],[132,98,4.6]];
  blossoms.forEach(([x,y,r],i)=>{
    for(let k=0;k<6;k++){const a=k*Math.PI/3+i*.7,px=(x+Math.cos(a)*r*.6).toFixed(1),py=(y+Math.sin(a)*r*.6).toFixed(1);
      g+=`<ellipse cx="${px}" cy="${py}" rx="${(r*.44).toFixed(1)}" ry="${(r*.6).toFixed(1)}" transform="rotate(${(a*57.3+90).toFixed(0)} ${px} ${py})" fill="#f2f2f2"/>`}
    g+=`<circle cx="${x}" cy="${y}" r="${(r*.36).toFixed(1)}" fill="#bdbdbd"/><circle cx="${x}" cy="${y}" r="${(r*.16).toFixed(1)}" fill="#fff"/>`});
  for(let i=0;i<14;i++){const a=-Math.PI*(.1+R2()*.8),d=34+R2()*6;g+=`<circle cx="${(100+Math.cos(a)*d*.9).toFixed(1)}" cy="${(86+Math.sin(a)*d*.75).toFixed(1)}" r="${(1.3+R2()*1).toFixed(1)}" fill="#fff"/>`}
  g+=`<path d="M91 140 Q100 135 109 140 Q100 147 91 140Z" fill="#fff"/><path d="M100 142 L93 154 M100 142 L107 154" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>`;
  $("sealSvg").innerHTML=`<defs><clipPath id="sc"><path d="${SPILL}"/></clipPath>
    <filter id="wl" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="h0"/>
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="f"/><feColorMatrix in="f" type="luminanceToAlpha" result="fa"/>
      <feComposite in="h0" in2="fa" operator="arithmetic" k2="1" k3=".02" result="h1"/><feGaussianBlur in="h1" stdDeviation="1" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="5" diffuseConstant="1.02" lighting-color="#F3E9DA" result="d"><feDistantLight azimuth="240" elevation="58"/></feDiffuseLighting>
      <feSpecularLighting in="h" surfaceScale="5" specularConstant=".3" specularExponent="14" lighting-color="#FFF8EE" result="s"><feDistantLight azimuth="240" elevation="50"/></feSpecularLighting>
      <feComposite in="d" in2="s" operator="arithmetic" k2=".9" k3=".35" k4=".07"/></filter>
    <filter id="b8" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b2" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="b1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".7"/></filter></defs>
    <g clip-path="url(#sc)"><g filter="url(#wl)"><rect width="200" height="200" fill="#000"/>
    <path d="${SPILL}" fill="#5a5a5a" filter="url(#b1)"/><path d="${CORE}" fill="#c8c8c8" filter="url(#b8)" transform="translate(100 100) scale(.94) translate(-100 -100)"/>
    <circle cx="100" cy="100" r="62" fill="#8a8a8a" filter="url(#b2)"/><circle cx="100" cy="100" r="63" fill="none" stroke="#efefef" stroke-width="6" filter="url(#b2)"/><circle cx="100" cy="100" r="56.5" fill="none" stroke="#a6a6a6" stroke-width="1.2" filter="url(#b1)"/>
    <g transform="translate(100 100) scale(.98) translate(-100 -104)" opacity=".75" filter="url(#b1)">${g}</g></g></g>`;
})();

/* ---------- calendar + event card ---------- */
(function(){
  const y=main.getFullYear(),m=main.getMonth();$("monthTitle").textContent=`${MONTH[m]} ${y}`;
  const byDay={};CONFIG.events.forEach((e,i)=>{const d=parse(e.date);if(d.getFullYear()===y&&d.getMonth()===m)byDay[d.getDate()]=i});
  let h=["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=>`<span class="dow">${d}</span>`).join("")+`<span class="dow-rule"></span>`;
  const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<start;i++)h+="<span></span>";
  for(let d=1;d<=days;d++)h+=d in byDay?`<span class="cal-day marked" aria-label="${d} ${MONTH[m]}, ${esc(CONFIG.events[byDay[d]].name)}">${d}</span>`:`<span class="cal-day">${d}</span>`;
  $("cal").innerHTML=h;
})();

/* ---------- fit the three blessing lines and the Bismillah to the column ---------- */
/* shrink single-line text until it fits its column; below a readable floor, let it wrap instead */
function fitBox(el,floor){
  if(!el)return;el.classList.remove("wrap");el.style.fontSize="";
  const cs=getComputedStyle(el),base=parseFloat(cs.fontSize),w=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  if(w<=0)return;
  const widest=Math.max(el.scrollWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),...[...el.children].filter(c=>getComputedStyle(c).display==="block").map(c=>c.scrollWidth));
  if(widest<=w)return;
  const f=base*w/widest*.97;
  if(f>=floor)el.style.fontSize=f+"px";else{el.style.fontSize=floor+"px";el.classList.add("wrap")}
}
function fit(){
  fitBox($("grace"),12);
  document.querySelectorAll(".announcement-names").forEach(e=>fitBox(e,30));
  const b=$("bism"),sp=b.firstElementChild;b.style.fontSize="60px";const bw=b.clientWidth,sw=sp.getBoundingClientRect().width;
  if(bw&&sw)b.style.fontSize=Math.min(60*bw/sw*.98,bw*.42)+"px";
}
window.addEventListener("resize",fit);
if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe(document.querySelector(".col"));
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener("loadingdone",fit);
/* ---------- fonts: wait for every face the card uses (max 6s), then reveal ---------- */
const FACES=['600 20px "Cormorant Garamond"','700 20px "Cormorant Garamond"','500 20px "Cormorant Garamond"','italic 500 20px "Cormorant Garamond"','italic 700 20px "Cormorant Garamond"','20px "Great Vibes"'];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const fontsReady=(document.fonts&&document.fonts.load)
  ? Promise.race([Promise.all([...FACES.map(f=>document.fonts.load(f,"Qusai Zahra MAMUWALA")),document.fonts.load('700 60px "Scheherazade New"',"\uFDFD")]).catch(()=>{}),wait(6000)])
  : Promise.resolve();
fontsReady.then(()=>{
  const loaded=fam=>{try{return [...document.fonts].some(f=>f.family.replace(/["']/g,"")===fam&&f.status==="loaded")}catch(e){return true}};
  // Bismillah ligature needs its own face; without it, spell the phrase out so any Arabic system font shows it properly
  if(document.fonts&&!loaded("Scheherazade New"))$("bism").firstElementChild.textContent="\u0628\u0650\u0633\u0652\u0645\u0650 \u0671\u0644\u0644\u0651\u064e\u0647\u0650 \u0671\u0644\u0631\u0651\u064e\u062d\u0652\u0645\u064e\u0670\u0646\u0650 \u0671\u0644\u0631\u0651\u064e\u062d\u0650\u064a\u0645\u0650";
  document.body.classList.add("fonts-ready");$("bism").style.visibility="visible";fit();
});
if(document.fonts)document.fonts.ready.then(fit);

/* ---------- music ---------- */
const audio=$("audio"),mBtn=$("music");
if(CONFIG.musicUrl){audio.src=CONFIG.musicUrl;mBtn.hidden=false;mBtn.onclick=()=>{if(audio.paused){audio.play().catch(()=>{});mBtn.textContent="❚❚"}else{audio.pause();mBtn.textContent="♫"}}}

/* ---------- open ---------- */
document.body.classList.add("locked");
let opening=false;
$("seal").addEventListener("click",async()=>{
  if(opening)return;opening=true;
  if(CONFIG.musicUrl)audio.play().then(()=>mBtn.textContent="❚❚").catch(()=>{});
  await fontsReady;
  document.body.classList.add("is-opening");
  setTimeout(()=>{document.body.classList.add("is-open");$("letter").removeAttribute("aria-hidden");document.body.classList.remove("locked");fit()},700);
  setTimeout(()=>{$("envelope").hidden=true},2200);
});
</script>
